<title>Your talk · FTS How we speak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<body data-chapter="2">
<div class="stage">
  <div class="bar">
    <span class="brand"><span class="dot"></span>From Thinking to Speaking · How we speak</span>
    <span class="chap"><i></i>2 · Build a talk</span>
  </div>
  <div class="content">
    <p class="eyebrow">Part 2 · Your talk</p>
    <h2 class="q">Your talk, in one minute</h2>
    <div class="builder-tool tool">
      <div class="builder">
        <div class="field"><label for="b-hook">1 · Hook</label><textarea id="b-hook"></textarea></div>
        <div class="field"><label for="b-idea">2 · My one idea</label><textarea id="b-idea"></textarea></div>
        <div class="field"><label for="b-story">Story that shows it</label><textarea id="b-story"></textarea></div>
        <div class="field"><label for="b-fact">Fact that backs it up</label><textarea id="b-fact"></textarea></div>
        <div class="field wide"><label for="b-cta">3 · Call to action</label><textarea id="b-cta"></textarea></div>
      </div>
      <div class="meter"><span class="words">0 words</span><div class="track"><div class="fill"></div></div><span class="secs">≈ 0 s at a calm pace</span></div>
    </div>
    <p class="hint">Pair check: your partner names your hook and your one idea. Did they hear the idea you meant?</p>
  </div>
  <nav class="foot"></nav>
</div>
<script src="assets/nav.js"></script>
<script src="assets/tools.js"></script>
